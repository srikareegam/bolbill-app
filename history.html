<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bol Bill — History</title>
<meta name="theme-color" content="#0F6B52">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="with-nav">
  <!-- Reports: two views behind one bottom tab -->
  <div class="tabbar">
    <a class="tabbtn active" href="history.html">Bills</a>
    <a class="tabbtn" href="summary.html">Day summary</a>
  </div>
  <div class="page-title">Bill history</div>
  <div class="page-sub">Every bill printed by any device on this shop</div>

  <div class="filter-row">
    <div class="filter-chip active" data-f="today">Today</div>
    <div class="filter-chip" data-f="yesterday">Yesterday</div>
    <div class="filter-chip" data-f="week">This week</div>
    <div class="filter-chip" data-f="all">All time</div>
  </div>

  <div id="list"></div>
</div>

<!-- Bill viewer: read only, with Reprint and "✎ Edit" -->
<div class="modal-backdrop hidden" id="modalBillView">
  <div class="modal">
    <div class="modal-title" id="bv-title">Bill</div>
    <div class="modal-sub" id="bv-sub"></div>
    <div class="receipt-card" style="margin-bottom:12px;">
      <div class="zigzag-top"></div>
      <div id="bv-items"></div>
    </div>
    <div class="totals" id="bv-totals" style="padding-top:0;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="bv-close">Close</button>
      <button class="btn btn-secondary" id="bv-reprint">🖨 Reprint</button>
    </div>
    <button class="btn btn-primary btn-full" id="bv-edit" style="margin-top:10px;">✎ Edit bill</button>
  </div>
</div>

<!-- Bill edit -->
<div class="modal-backdrop hidden" id="modalBill">
  <div class="modal">
    <div class="modal-title" id="bd-title">Bill</div>
    <div class="modal-sub">Edit items or customer, then save or reprint</div>

    <div class="customer-row" style="margin-bottom:14px;">
      <input type="text" id="bd-customerName" placeholder="Customer name">
      <input type="tel" id="bd-customerPhone" placeholder="Phone" style="max-width:120px;">
    </div>

    <div id="bd-items"></div>
    <button class="icon-btn" id="bd-addItem" style="margin:8px 0 4px;">+ Add item</button>

    <div class="totals" id="bd-totals" style="padding-top:6px;"></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="bd-close">Close</button>
      <button class="btn btn-secondary" id="bd-reprint">🖨 Reprint</button>
    </div>
    <button class="btn btn-primary btn-full" id="bd-save" style="margin-top:10px;">💾 Save changes</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="nav-glyph">🧾</span>Bill</a>
  <a class="nav-item" href="purchases.html"><span class="nav-glyph">📦</span>Purchase</a>
  <a class="nav-item active" href="history.html"><span class="nav-glyph">📊</span>Reports</a>
  <a class="nav-item" href="more.html"><span class="nav-glyph">☰</span>More</a>
</nav>

<div id="printArea">
  <div class="p-center">
    <div class="p-shop-name" id="pr-shopName"></div>
    <div class="p-meta" id="pr-shopAddress"></div>
    <div class="p-meta" id="pr-shopPhone"></div>
    <div class="p-meta" id="pr-shopGst"></div>
  </div>
  <div class="p-rule"></div>
  <div class="p-row"><span id="pr-billNo"></span><span id="pr-date"></span></div>
  <div class="p-row" id="pr-customerRow"></div>
  <div class="p-rule"></div>
  <div id="pr-items"></div>
  <div class="p-rule"></div>
  <div class="p-row"><span>Subtotal</span><span id="pr-subtotal"></span></div>
  <div class="p-row" id="pr-taxRow"></div>
  <div class="p-row p-total"><span>TOTAL</span><span id="pr-total"></span></div>
  <div class="p-footer" id="pr-footer"></div>
</div>

<script type="module">
import { requireShopOrRedirect, subscribeBills, subscribeSettings, updateBill } from "./data.js";

const shop = requireShopOrRedirect();
if (shop) {
  const $ = (id) => document.getElementById(id);
  const rupee = (n) => "₹" + (Math.round(n*100)/100).toFixed(2);
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  let allBills = [];
  let settings = {};
  let currentFilter = "today";

  subscribeSettings(shop.shopCode, (data) => { settings = data; });
  subscribeBills(shop.shopCode, (bills) => { allBills = bills; render(); });

  function toDate(b){
    if (b.createdAt && b.createdAt.toDate) return b.createdAt.toDate();
    return new Date();
  }
  function isSameDay(d1, d2){
    return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
  }
  function filterBills(){
    const now = new Date();
    if (currentFilter === "all") return allBills;
    if (currentFilter === "today") return allBills.filter(b => isSameDay(toDate(b), now));
    if (currentFilter === "yesterday"){
      const y = new Date(now); y.setDate(y.getDate()-1);
      return allBills.filter(b => isSameDay(toDate(b), y));
    }
    if (currentFilter === "week"){
      const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
      return allBills.filter(b => toDate(b) >= weekAgo);
    }
    return allBills;
  }

  function render(){
    const bills = filterBills();
    const box = $("list");
    if (bills.length === 0){
      box.innerHTML = `<div class="history-empty">No bills in this range yet</div>`;
      return;
    }
    box.innerHTML = bills.map(b => {
      const d = toDate(b);
      return `<div class="history-item" data-id="${b.id}">
        <div class="hi-left">
          <b>#${String(b.billNo).padStart(4,"0")}</b>
          <div>${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} ${d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ${b.items.length} item${b.items.length!==1?"s":""}${b.customerName? " · "+escapeHtml(b.customerName):""}</div>
        </div>
        <div class="hi-right">${rupee(b.total)}</div>
      </div>`;
    }).join("");
    box.querySelectorAll(".history-item").forEach(el => {
      el.onclick = () => openBillView(bills.find(b => b.id === el.dataset.id));   // read-only first
    });
  }

  // ---------- Bill viewer (read only) ----------
  let viewingBill = null;
  function openBillView(b){
    if (!b) return;
    viewingBill = b;
    const d = toDate(b);
    $("bv-title").textContent = "Bill #" + String(b.billNo).padStart(4, "0");
    $("bv-sub").textContent = [
      d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }),
      [b.customerName, b.customerPhone].filter(Boolean).join(" · ")
    ].filter(Boolean).join(" · ");
    $("bv-items").innerHTML = (b.items || []).map((it, i) => `
      <div class="item-row">
        <div class="item-idx">${i + 1}</div>
        <div class="item-info">
          <div class="item-name">${escapeHtml(it.name)}</div>
          <div class="item-sub">${it.qty} × ${rupee(it.price)}</div>
        </div>
        <div class="item-amt">${rupee(it.qty * it.price)}</div>
      </div>`).join("") || `<div class="history-empty" style="padding:14px 0;">No items</div>`;
    let t = `<div class="totals-line"><span>Subtotal</span><span class="amt">${rupee(b.subtotal)}</span></div>`;
    if (b.tax) t += `<div class="totals-line"><span>Tax</span><span class="amt">${rupee(b.tax)}</span></div>`;
    t += `<div class="totals-line grand"><span>Total</span><span class="amt">${rupee(b.total)}</span></div>`;
    $("bv-totals").innerHTML = t;
    $("modalBillView").classList.remove("hidden");
  }
  $("bv-close").onclick = () => { $("modalBillView").classList.add("hidden"); viewingBill = null; };
  $("bv-reprint").onclick = () => {
    const b = viewingBill;
    if (b) reprintBill(b.billNo, toDate(b), b.customerName || "", b.customerPhone || "", b.items || [], b.subtotal, b.tax, b.total, "reprint");
  };
  $("bv-edit").onclick = () => {
    const b = viewingBill;
    $("modalBillView").classList.add("hidden");
    viewingBill = null;
    openBillDetail(b);
  };

  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.f;
      render();
    };
  });

  function reprintBill(billNo, dateObj, customerName, customerPhone, items, subtotal, tax, total, tag){
    $("pr-shopName").textContent = settings.shopName || "";
    $("pr-shopAddress").textContent = settings.shopAddress || "";
    $("pr-shopPhone").textContent = settings.shopPhone ? ("Ph: " + settings.shopPhone) : "";
    $("pr-shopGst").textContent = settings.shopGst ? ("GSTIN: " + settings.shopGst) : "";
    $("pr-billNo").textContent = "Bill #" + String(billNo).padStart(4,"0") + (tag ? " (" + tag + ")" : "");
    $("pr-date").textContent = dateObj.toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
    $("pr-customerRow").innerHTML = customerName ? `<span>Customer</span><span>${escapeHtml(customerName)}${customerPhone ? " · "+escapeHtml(customerPhone) : ""}</span>` : "";
    $("pr-items").innerHTML = items.map((it,i)=>`
      <div class="p-item-name">${i+1}. ${escapeHtml(it.name)}</div>
      <div class="p-item-sub"><span>${it.qty} × ${rupee(it.price)}</span><span>${rupee(it.qty*it.price)}</span></div>
    `).join("");
    $("pr-subtotal").textContent = rupee(subtotal);
    $("pr-taxRow").innerHTML = tax ? `<span>Tax</span><span>${rupee(tax)}</span>` : "";
    $("pr-total").textContent = rupee(total);
    $("pr-footer").textContent = settings.shopFooter || "";
    window.print();
  }

  // ---------- Bill detail / edit ----------
  let editingBill = null;   // the original bill record
  let editItems = [];       // working copy of items being edited

  function computeEditTotals(){
    const subtotal = editItems.reduce((s, it) => s + it.qty * it.price, 0);
    const tax = subtotal * (settings.taxRate || 0) / 100;
    return { subtotal, tax, total: subtotal + tax };
  }

  function renderEditItems(){
    const box = $("bd-items");
    if (editItems.length === 0){
      box.innerHTML = `<div class="history-empty">No items — add one below</div>`;
    } else {
      box.innerHTML = editItems.map(it => `
        <div class="edit-item-row" data-id="${it.id}">
          <input type="text" class="ei-name" value="${escapeHtml(it.name)}">
          <input type="number" class="ei-qty" value="${it.qty}" inputmode="decimal">
          <span class="ei-x">×</span>
          <input type="number" class="ei-price" value="${it.price}" inputmode="decimal">
          <button class="ei-del" data-id="${it.id}">✕</button>
        </div>
      `).join("");
    }
    box.querySelectorAll(".ei-del").forEach(btn => {
      btn.onclick = () => { editItems = editItems.filter(it => it.id !== btn.dataset.id); renderEditItems(); };
    });
    box.querySelectorAll(".ei-name, .ei-qty, .ei-price").forEach(inp => {
      inp.oninput = () => {
        const row = inp.closest(".edit-item-row");
        const it = editItems.find(i => i.id === row.dataset.id);
        if (!it) return;
        if (inp.classList.contains("ei-name")) it.name = inp.value;
        if (inp.classList.contains("ei-qty")) it.qty = parseFloat(inp.value) || 0;
        if (inp.classList.contains("ei-price")) it.price = parseFloat(inp.value) || 0;
        renderEditTotals();
      };
    });
    renderEditTotals();
  }

  function renderEditTotals(){
    const { subtotal, tax, total } = computeEditTotals();
    let html = `<div class="totals-line"><span>Subtotal</span><span class="amt">${rupee(subtotal)}</span></div>`;
    if (settings.taxRate) html += `<div class="totals-line"><span>Tax (${settings.taxRate}%)</span><span class="amt">${rupee(tax)}</span></div>`;
    html += `<div class="totals-line grand"><span>Total</span><span class="amt">${rupee(total)}</span></div>`;
    $("bd-totals").innerHTML = html;
  }

  function openBillDetail(b){
    if (!b) return;
    editingBill = b;
    editItems = b.items.map(it => Object.assign({}, it, { id: it.id || (Date.now()+"_"+Math.random().toString(36).slice(2)) }));
    $("bd-title").textContent = "Bill #" + String(b.billNo).padStart(4,"0");
    $("bd-customerName").value = b.customerName || "";
    $("bd-customerPhone").value = b.customerPhone || "";
    renderEditItems();
    $("modalBill").classList.remove("hidden");
  }

  $("bd-addItem").onclick = () => {
    editItems.push({ id: Date.now()+"_"+Math.random().toString(36).slice(2), name: "", qty: 1, price: 0 });
    renderEditItems();
  };
  $("bd-close").onclick = () => { $("modalBill").classList.add("hidden"); editingBill = null; };

  $("bd-reprint").onclick = () => {
    if (!editingBill) return;
    const { subtotal, tax, total } = computeEditTotals();
    reprintBill(editingBill.billNo, toDate(editingBill), $("bd-customerName").value.trim(), $("bd-customerPhone").value.trim(), editItems, subtotal, tax, total, "reprint");
  };

  $("bd-save").onclick = async () => {
    if (!editingBill) return;
    const cleanItems = editItems.filter(it => it.name.trim() && it.qty > 0 && it.price >= 0)
      .map(it => Object.assign({}, it, { name: it.name.trim() }));
    if (cleanItems.length === 0){ alert("A bill needs at least one item with a name, quantity and price."); return; }
    editItems = cleanItems;
    const { subtotal, tax, total } = computeEditTotals();
    const btn = $("bd-save");
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      await updateBill(shop.shopCode, editingBill.id, {
        items: cleanItems,
        customerName: $("bd-customerName").value.trim(),
        customerPhone: $("bd-customerPhone").value.trim(),
        subtotal, tax, total
      });
      $("modalBill").classList.add("hidden");
      editingBill = null;
    }catch(e){
      console.error(e);
      alert("Couldn't save changes — check your connection.");
    }
    btn.disabled = false; btn.textContent = original;
  };
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
